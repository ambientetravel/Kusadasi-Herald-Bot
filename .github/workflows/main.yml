name: Kusadasi Herald Automated Engine
on:
  schedule:
    - cron: '0 7,18 * * *'
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: false

jobs:
  build-and-deliver:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Pull Latest Code
        uses: actions/checkout@v4

      - name: 2. Initialize Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # REMOVED CACHE LINE FROM HERE

      - name: 3. Install Modern Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: 4. Execute Newspaper Generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python newspaper_bot.py
