name: Kusadasi Herald Automated Engine
on:
  schedule:
    # GHA latency on this repo: ~5h morning / ~3h evening (audited).     # Pre-schedule so delayed actual fire lands at target local time.     - cron: '0 2,15 * * *'   # 02:00 + ~5h = 10:00 local (AM)                               # 15:00 + ~3h = 21:00 local (PM)
  workflow_dispatch:

jobs:
  build-and-deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Requests
        run: pip install requests

      - name: Run Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python newspaper_bot.py
